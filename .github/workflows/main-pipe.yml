name: "PHP SAST"

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  schedule:
    - cron: "16 1 * * 3"

  workflow_dispatch:

jobs:
  sast:
    name: PHP SAST - Semgrep
    runs-on: ubuntu-24.04

    permissions:
      contents: read
      security-events: write

    container:
      image: semgrep/semgrep:latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Run PHP SAST
        run: |
          semgrep scan \
            --config=p/php \
            --include='*.php' \
            --sarif \
            --output=semgrep.sarif \
            --error \
            --metrics=off \
            .

      - name: Upload SARIF results
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: semgrep.sarif
          category: php-sast
```
