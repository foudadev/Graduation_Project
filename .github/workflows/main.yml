name: "PHP SAST - Semgrep"

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  schedule:
    - cron: "16 1 * * 3"

  workflow_dispatch:

jobs:
  sast:
    name: PHP SAST - Semgrep
    runs-on: ubuntu-24.04

    permissions:
      contents: read
      security-events: write

    container:
      image: semgrep/semgrep:latest

    steps:

      # ==========================================
      # Checkout repository
      # ==========================================
      - name: Checkout repository
        uses: actions/checkout@v5

      # ==========================================
      # Run PHP SAST and generate SARIF
      # ==========================================
      - name: Run PHP SAST
        run: |
          semgrep scan \
            --config=p/php \
            --include='*.php' \
            --sarif \
            --output=semgrep.sarif \
            --metrics=off \
            .

      # ==========================================
      # Show findings in GitHub Actions log
      # ==========================================
      - name: Show SAST findings
        if: always()
        run: |
          echo "=========================================="
          echo "PHP SAST - Semgrep Findings"
          echo "=========================================="

          semgrep scan \
            --config=p/php \
            --include='*.php' \
            --metrics=off \
            .

      # ==========================================
      # Upload SARIF to GitHub Code Scanning
      # ==========================================
      - name: Upload SARIF to GitHub Code Scanning
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: semgrep.sarif
          category: php-sast

      # ==========================================
      # Upload SARIF as GitHub Actions artifact
      # ==========================================
      - name: Upload Semgrep SARIF artifact
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: semgrep-sarif
          path: semgrep.sarif
          if-no-files-found: error
