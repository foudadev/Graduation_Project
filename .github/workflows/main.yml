name: "PHP SAST"

on:
  push:
    branches: ["main"]

  pull_request:
    branches: ["main"]

  schedule:
    - cron: "16 1 * * 3"

  workflow_dispatch:

jobs:
  analyze:
    name: Analyze (PHP)
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          coverage: none

      - name: Install PHPStan
        run: |
          composer require --dev phpstan/phpstan --no-interaction

      - name: Run PHPStan
        run: |
          vendor/bin/phpstan analyse . --level=5
