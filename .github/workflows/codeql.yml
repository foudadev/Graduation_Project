name: "PHP Security Analysis"

on:
  push:
    branches: ["main"]

  pull_request:
    branches: ["main"]

  schedule:
    - cron: "16 1 * * 3"

  workflow_dispatch:

permissions:
  contents: read

jobs:

  # ============================================================
  # PHP Static Analysis - PHPStan
  # ============================================================
  phpstan:
    name: PHPStan SAST
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: mbstring, xml, curl, json
          coverage: none

      - name: Validate Composer
        run: composer validate --strict

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Run PHPStan
        run: |
          if [ -f vendor/bin/phpstan ]; then
            vendor/bin/phpstan analyse
          else
            echo "PHPStan is not installed."
            echo "Install it with: composer require --dev phpstan/phpstan"
            exit 1
          fi


  # ============================================================
  # PHP Static Analysis - Psalm
  # ============================================================
  psalm:
    name: Psalm SAST
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: mbstring, xml, curl, json
          coverage: none

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Run Psalm
        run: |
          if [ -f vendor/bin/psalm ]; then
            vendor/bin/psalm
          else
            echo "Psalm is not installed."
            echo "Install it with: composer require --dev vimeo/psalm"
            exit 1
          fi


  # ============================================================
  # Composer Dependency Security
  # ============================================================
  composer-audit:
    name: Composer Dependency Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          coverage: none

      - name: Composer Audit
        run: composer audit


  # ============================================================
  # PHP Code Style / Quality
  # ============================================================
  php-cs-fixer:
    name: PHP Code Quality
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          coverage: none

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Run PHP CS Fixer
        run: |
          if [ -f vendor/bin/php-cs-fixer ]; then
            vendor/bin/php-cs-fixer fix --dry-run --diff
          else
            echo "PHP CS Fixer is not installed."
            echo "Install it with: composer require --dev friendsofphp/php-cs-fixer"
            exit 1
          fi
